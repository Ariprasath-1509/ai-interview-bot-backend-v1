input {
  tcp {
    port => 5000
    codec => json_lines
  }
}

filter {
  # Parse JSON if it's a string
  if [message] =~ /^\{.*\}$/ {
    json {
      source => "message"
    }
  }

  # Add service metadata
  mutate {
    add_field => {
      "[@metadata][index_prefix]" => "bench-logs"
    }
  }

  # Extract error details if present
  if [level] == "ERROR" or [level_value] == 40000 {
    mutate {
      add_tag => ["error"]
    }
  }

  # Extract warning details if present
  if [level] == "WARN" or [level_value] == 30000 {
    mutate {
      add_tag => ["warning"]
    }
  }

  # Tag AI service operations
  if [serviceName] == "ai-service" {
    mutate {
      add_tag => ["ai-operation"]
    }
  }

  # Tag authentication events
  if [serviceName] == "auth-service" {
    mutate {
      add_tag => ["auth-event"]
    }
  }

  # Tag interview lifecycle events
  if [serviceName] == "interview-service" {
    mutate {
      add_tag => ["interview-event"]
    }
  }

  # Add timestamp if missing
  if !["@timestamp"] {
    mutate {
      add_field => { "@timestamp" => "%{timestamp}" }
    }
  }
}

output {
  elasticsearch {
    hosts => ["${ELASTICSEARCH_HOSTS}"]
    index => "bench-logs-%{+YYYY.MM.dd}"
  }

  # Debug output (comment out in production for performance)
  # stdout {
  #   codec => rubydebug
  # }
}
