server:
  port: 6005

spring:
  application:
    name: compliance-service
  datasource:
    url: jdbc:postgresql://localhost:3308/bench_readiness
    username: postgres
    password: root
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: compliance_svc
  flyway:
    schemas: compliance_svc
    locations: classpath:db/migration

eureka:
  client:
    service-url:
      defaultZone: http://localhost:6009/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

app:
  jwt:
    secret: dev-jwt-secret-change-in-production-min-32-chars
