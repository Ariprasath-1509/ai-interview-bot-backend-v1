server:
  port: 6005

spring:
  application:
    name: compliance-service
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:3308/bench_readiness}
    username: postgres
    password: root
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: compliance_svc
  flyway:
    schemas: compliance_svc
    locations: classpath:db/migration

app:
  jwt:
    secret: ${JWT_SECRET:dev-jwt-secret-change-in-production-min-32-chars}
