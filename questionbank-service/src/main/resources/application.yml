spring:
  # Optional .env at repo root (see .env.example). Override with ENV_FILE=/path/to/.env
  config:
    import:
      - optional:file:${ENV_FILE:${user.dir}/../.env}[.properties]
      - optional:file:${user.dir}/.env[.properties]
  application:
    name: questionbank-service

  profiles:
    active: local

  datasource:
    # socketTimeout/connectTimeout in seconds — required for remote PostgreSQL over slow networks
    url: ${DB_QB_URL:}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 120000
      validation-timeout: 15000
      idle-timeout: 120000
      max-lifetime: 300000
      keepalive-time: 30000
      initialization-fail-timeout: 120000
      leak-detection-threshold: 180000
      connection-init-sql: SET search_path TO questionbank_svc, public; SET TIME ZONE 'UTC';

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: questionbank_svc
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC

  flyway:
    schemas: questionbank_svc
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: false
    ignore-migration-patterns: "*:missing,*:ignored"
    connect-retries: 5
    connect-retries-interval: 10s

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

  cache:
    type: caffeine
    cache-names: questions,question,companies,tags,sessions,admin-dashboard
    caffeine:
      spec: maximumSize=500,expireAfterWrite=600s

server:
  port: 6016
  servlet:
    context-path: /
  compression:
    enabled: true
    min-response-size: 1024
    mime-types: application/json,text/html,text/css,application/javascript,text/plain

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

# --- App-specific config ---
app:
  cors:
    allowed-origins: http://localhost:5173,http://localhost:3000,http://localhost:6001,http://localhost:6101,http://103.182.211.219:6001,http://103.182.211.219:6101,https://prod.voiceaibot.in
  email:
    sender-email: ${MAIL_USERNAME:}
    sender-name: QuestionBank
  jwt:
    secret: ${JWT_SECRET:}
    issuer: ${JWT_ISSUER:benchreadiness-auth}
    audience: ${JWT_AUDIENCE:benchreadiness-api}
    expiry-ms: ${JWT_ACCESS_EXPIRY_MS:1800000}
  gateway:
    shared-key: ${GATEWAY_SHARED_KEY:}

  fuzzy-match:
    suggest-threshold: 0.55
    commit-link-threshold: 0.60
    general-category-threshold: 0.65
    min-text-length: 25

eureka:
  client:
    service-url:
      defaultZone: http://localhost:6009/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    hostname: localhost
    prefer-ip-address: false
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30