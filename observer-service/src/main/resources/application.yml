server:
  port: 6007

spring:
  application:
    name: observer-service
  datasource:
    # socketTimeout/connectTimeout in seconds — required for remote PostgreSQL over slow networks
    url: jdbc:postgresql://103.182.211.219:5434/aibot?tcpKeepAlive=true&connectTimeout=60&socketTimeout=300&loginTimeout=60
    username: aibot
    password: aibot!@#$%
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 120000
      validation-timeout: 15000
      idle-timeout: 120000
      max-lifetime: 300000
      keepalive-time: 30000
      initialization-fail-timeout: 120000
      leak-detection-threshold: 180000
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: observer_svc
    open-in-view: false
  flyway:
    schemas: observer_svc
    locations: classpath:db/migration
    connect-retries: 5
    connect-retries-interval: 10s
  mail:
    host: smtp.gmail.com
    port: 587
    username: learningdevelopment.tyss@gmail.com
    password: xcbc bgrj lbql tgkd
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:6009/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    hostname: localhost
    prefer-ip-address: false
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

app:
  jwt:
    secret: dev-jwt-secret-change-in-production-min-32-chars
  interview-base-url: https://prod.voiceaibot.in/interview
  frontend-url: https://prod.voiceaibot.in
  digest:
    cron: 0 0 19 * * *

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env,loggers
  endpoint:
    health:
      show-details: always
