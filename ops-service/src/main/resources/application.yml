server:
  port: 6005

spring:
  # Optional .env at repo root (see .env.example). Override with ENV_FILE=/path/to/.env
  config:
    import:
      - optional:file:${ENV_FILE:${user.dir}/../.env}[.properties]
      - optional:file:${user.dir}/.env[.properties]
  main:
    allow-bean-definition-overriding: true
  application:
    name: ops-service
  datasource:
    # socketTimeout/connectTimeout in seconds — required for remote PostgreSQL over slow networks
    url: ${DB_URL:${DATABASE_URL:}}
    username: ${DB_USERNAME:${DB_USER:}}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 120000
      validation-timeout: 15000
      idle-timeout: 120000
      max-lifetime: 300000
      keepalive-time: 30000
      initialization-fail-timeout: 120000
      leak-detection-threshold: 180000
      connection-init-sql: SET search_path TO compliance_svc, observer_svc, public
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: compliance_svc
    open-in-view: false
  flyway:
    # Shares one PostgreSQL advisory lock per DB — do not run compliance-service or
    # observer-service alongside ops-service; increase retries for slow remote startup.
    schemas: compliance_svc,observer_svc
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: false
    out-of-order: true
    connect-retries: 5
    connect-retries-interval: 10s
    lock-retry-count: 150
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:learningdevelopment.tyss@gmail.com}
    password: ${MAIL_PASSWORD:xcbc bgrj lbql tgkd}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:6009/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    hostname: localhost
    prefer-ip-address: false
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

app:
  jwt:
    secret: ${JWT_SECRET:}
    issuer: ${JWT_ISSUER:benchreadiness-auth}
    audience: ${JWT_AUDIENCE:benchreadiness-api}
  gateway:
    shared-key: ${GATEWAY_SHARED_KEY:}
  interview-base-url: https://prod.voiceaibot.in/interview
  frontend-url: https://prod.voiceaibot.in
  digest:
    cron: 0 0 19 * * *

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
