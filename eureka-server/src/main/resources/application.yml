server:
  port: 6009

spring:
  # Optional .env at repo root (see .env.example). Override with ENV_FILE=/path/to/.env
  config:
    import:
      - optional:file:${ENV_FILE:${user.dir}/../.env}[.properties]
      - optional:file:${user.dir}/.env[.properties]
  application:
    name: eureka-server

eureka:
  instance:
    hostname: localhost
    prefer-ip-address: false
  client:
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://localhost:6009/eureka/
  server:
    enable-self-preservation: false
    eviction-interval-timer-in-ms: 5000

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never