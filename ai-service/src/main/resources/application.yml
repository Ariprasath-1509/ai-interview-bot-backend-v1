server:
  port: 6003

spring:
  application:
    name: ai-service

eureka:
  client:
    service-url:
      defaultZone: http://localhost:6009/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    hostname: localhost
    prefer-ip-address: false
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

app:
  llm:
    # Switch LLM provider: 'claude' (default) or 'ollama'
    provider: claude
  jwt:
    secret: dev-jwt-secret-change-in-production-min-32-chars
  claude:
    api-key: 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
    model: claude-haiku-4-5
    assessment-model: claude-sonnet-4-5
    question-temperature: 0.55
    assessment-temperature: 0.25
  ollama:
    base-url: http://103.182.211.219:11434
    model: qwen2.5:1.5b
    temperature: 0.55
    timeout-seconds: 600

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env,loggers
  endpoint:
    health:
      show-details: always
