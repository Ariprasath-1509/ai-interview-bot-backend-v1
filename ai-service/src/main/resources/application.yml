server:
  port: 6003

spring:
  application:
    name: ai-service

eureka:
  client:
    service-url:
      defaultZone: http://localhost:6009/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    hostname: localhost
    prefer-ip-address: false
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

app:
  llm:
    # Switch LLM provider: 'claude' (default) or 'ollama'
    provider: ${APP_LLM_PROVIDER:claude}
  jwt:
    secret: dev-jwt-secret-change-in-production-min-32-chars
  claude:
    api-key: ${APP_CLAUDE_API_KEY:}
    model: ${APP_CLAUDE_MODEL:claude-haiku-4-5}
    assessment-model: ${APP_CLAUDE_ASSESSMENT_MODEL:claude-sonnet-4-5}
    question-temperature: ${APP_CLAUDE_QUESTION_TEMPERATURE:0.55}
    assessment-temperature: ${APP_CLAUDE_ASSESSMENT_TEMPERATURE:0.25}
  ollama:
    base-url: ${APP_OLLAMA_BASE_URL:http://103.182.211.219:11434}
    model: ${APP_OLLAMA_MODEL:qwen2.5:1.5b}
    assessment-model: ${APP_OLLAMA_ASSESSMENT_MODEL:qwen2.5:7b}
    question-temperature: ${APP_OLLAMA_QUESTION_TEMPERATURE:0.55}
    assessment-temperature: ${APP_OLLAMA_ASSESSMENT_TEMPERATURE:0.3}
    timeout-seconds: ${APP_OLLAMA_TIMEOUT_SECONDS:600}
  assessment:
    async-enabled: true
    thread-pool-size: 10
    queue-capacity: 50

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env,loggers
  endpoint:
    health:
      show-details: always
