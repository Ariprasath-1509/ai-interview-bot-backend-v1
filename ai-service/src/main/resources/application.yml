server:
  port: 6003

spring:
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  # Optional .env at repo root (see .env.example). Override with ENV_FILE=/path/to/.env
  config:
    import:
      - optional:file:${ENV_FILE:${user.dir}/../.env}[.properties]
      - optional:file:${user.dir}/.env[.properties]
  application:
    name: ai-service

eureka:
  client:
    service-url:
      defaultZone: http://localhost:6009/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    hostname: localhost
    prefer-ip-address: false
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

app:
  llm:
    # 'claude' routes everything to Claude (recommended for production quality)
    # 'hybrid' allows per-operation routing via admin UI; 'ollama' routes everything to Ollama
    provider: ${APP_LLM_PROVIDER:claude}
  jwt:
    secret: ${JWT_SECRET:}
    issuer: ${JWT_ISSUER:benchreadiness-auth}
    audience: ${JWT_AUDIENCE:benchreadiness-api}
  claude:
    api-key: ${APP_CLAUDE_API_KEY:}
    model: ${APP_CLAUDE_MODEL:claude-haiku-4-5}
    assessment-model: ${APP_CLAUDE_ASSESSMENT_MODEL:claude-sonnet-4-6}
    question-temperature: ${APP_CLAUDE_QUESTION_TEMPERATURE:0.55}
    assessment-temperature: ${APP_CLAUDE_ASSESSMENT_TEMPERATURE:0.25}
  ollama:
    base-url: ${APP_OLLAMA_BASE_URL:http://103.182.211.219:11434}
    # Conversational Bot — qwen2.5:14b: fast, strong reasoning, good code/tech vocabulary
    question-model: ${APP_OLLAMA_QUESTION_MODEL:qwen2.5:14b}
    # Assessment Evaluator — routed to Claude in hybrid mode; Ollama fallback if Claude unavailable
    assessment-model: ${APP_OLLAMA_ASSESSMENT_MODEL:qwen2.5:14b}
    # Rubric Generator — qwen2.5:14b: reliable structured JSON output
    rubric-model: ${APP_OLLAMA_RUBRIC_MODEL:qwen2.5:14b}
    # Candidate Matcher — routed to Claude in hybrid mode; Ollama fallback if Claude unavailable
    matching-model: ${APP_OLLAMA_MATCHING_MODEL:qwen2.5:14b}
    transcribe-model: ${APP_OLLAMA_TRANSCRIBE_MODEL:whisper}
    question-temperature: ${APP_OLLAMA_QUESTION_TEMPERATURE:0.0}
    assessment-temperature: ${APP_OLLAMA_ASSESSMENT_TEMPERATURE:0.2}
    rubric-temperature: ${APP_OLLAMA_RUBRIC_TEMPERATURE:0.1}
    timeout-seconds: ${APP_OLLAMA_TIMEOUT_SECONDS:600}
    num-parallel-threads: ${APP_OLLAMA_NUM_PARALLEL_THREADS:4}
  assessment:
    async-enabled: true
    thread-pool-size: 10
    queue-capacity: 50
  media:
    stt-provider: ${APP_MEDIA_STT_PROVIDER:faster-whisper}
    whisper-url: ${APP_MEDIA_WHISPER_URL:http://localhost:6013}
    whisper-model: ${APP_MEDIA_WHISPER_MODEL:whisper-1}
    kokoro-url: ${APP_MEDIA_KOKORO_URL:http://localhost:6014}
    kokoro-voice: ${APP_MEDIA_KOKORO_VOICE:af_heart}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
