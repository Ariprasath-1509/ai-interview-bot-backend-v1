eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:6009/eureka/
  instance:
    prefer-ip-address: true

spring:
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

logstash:
  host: logstash

app:
  llm:
    provider: ${APP_LLM_PROVIDER:claude}
  claude:
    api-key: ${APP_CLAUDE_API_KEY:}
    model: ${APP_CLAUDE_MODEL:claude-haiku-4-5}
    assessment-model: ${APP_CLAUDE_ASSESSMENT_MODEL:claude-sonnet-4-6}
    question-temperature: ${APP_CLAUDE_QUESTION_TEMPERATURE:0.55}
    assessment-temperature: ${APP_CLAUDE_ASSESSMENT_TEMPERATURE:0.25}
  ollama:
    base-url: ${APP_OLLAMA_BASE_URL:http://103.182.211.219:11434}
    model: ${APP_OLLAMA_MODEL:qwen2.5:14b}
  media:
    stt-provider: ${APP_MEDIA_STT_PROVIDER:sarvam}
    sarvam-api-key: ${SARVAM_API_KEY:}
    sarvam-url: ${SARVAM_API_URL:https://api.sarvam.ai}
    sarvam-model: ${SARVAM_MODEL:saarika:v2}
    whisper-url: ${APP_MEDIA_WHISPER_URL:http://whisper-stt:8000}
    # whisper-1 tells TranscribeService not to send a model field — server uses its preloaded WHISPER__MODEL
    whisper-model: ${APP_MEDIA_WHISPER_MODEL:whisper-1}
    kokoro-url: ${APP_MEDIA_KOKORO_URL:http://kokoro-tts:8880}
    kokoro-voice: ${APP_MEDIA_KOKORO_VOICE:af_heart}
