server:
  port: 6006

spring:
  application:
    name: interview-service
  cloud:
    compatibility-verifier:
      enabled: false
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=5m
    cache-names:
      - candidateMatches
      - eligibleCandidates
  datasource:
    # socketTimeout/connectTimeout in seconds — required for remote PostgreSQL over slow networks
    url: jdbc:postgresql://103.182.211.219:5434/aibot?tcpKeepAlive=true&connectTimeout=60&socketTimeout=300&loginTimeout=60
    username: aibot
    password: aibot!@#$%
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 120000
      validation-timeout: 15000
      idle-timeout: 120000
      max-lifetime: 300000
      keepalive-time: 30000
      initialization-fail-timeout: 120000
      leak-detection-threshold: 180000
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: interview_svc
    open-in-view: false
  flyway:
    schemas: interview_svc
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: false
    ignore-migration-patterns: "*:missing,*:ignored"
    connect-retries: 5
    connect-retries-interval: 10s
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB
      enabled: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:6009/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    hostname: localhost
    prefer-ip-address: false
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

app:
  jwt:
    secret: dev-jwt-secret-change-in-production-min-32-chars
  resume:
    storage:
      path: uploads/resumes
  recording:
    upload-dir: ${APP_RECORDING_DIR:uploads/recordings}
  matching:
    weights:
      skill: 0.40
      experience: 0.20
      feedback: 0.20
      question-relevance: 0.20
  document-service:
    url: http://103.182.211.219:6565

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env,loggers
  endpoint:
    health:
      show-details: always


