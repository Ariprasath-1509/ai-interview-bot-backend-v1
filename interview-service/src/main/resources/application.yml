server:
  port: 6006

spring:
  # Optional .env at repo root (see .env.example). Override with ENV_FILE=/path/to/.env
  config:
    import:
      - optional:file:${ENV_FILE:${user.dir}/../.env}[.properties]
      - optional:file:${user.dir}/.env[.properties]
  application:
    name: interview-service
  cloud:
    compatibility-verifier:
      enabled: false
    openfeign:
      httpclient:
        hc5:
          enabled: true
      client:
        config:
          default:
            connectTimeout: 30000
            readTimeout: 120000
          aiServiceClient:
            connectTimeout: 30000
            readTimeout: 600000
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=5m
    cache-names:
      - candidateMatches
      - eligibleCandidates
  datasource:
    # socketTimeout/connectTimeout in seconds — required for remote PostgreSQL over slow networks
    url: ${DB_URL:${DATABASE_URL:}}
    username: ${DB_USERNAME:${DB_USER:}}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 120000
      validation-timeout: 15000
      idle-timeout: 120000
      max-lifetime: 300000
      keepalive-time: 30000
      initialization-fail-timeout: 120000
      leak-detection-threshold: 180000
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: interview_svc
    open-in-view: false
  flyway:
    schemas: interview_svc
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: false
    ignore-migration-patterns: "*:missing,*:ignored"
    connect-retries: 5
    connect-retries-interval: 10s
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB
      enabled: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:6009/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    hostname: localhost
    prefer-ip-address: false
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

app:
  jwt:
    secret: ${JWT_SECRET:}
    issuer: ${JWT_ISSUER:benchreadiness-auth}
    audience: ${JWT_AUDIENCE:benchreadiness-api}
  gateway:
    shared-key: ${GATEWAY_SHARED_KEY:}
  branch-segregation:
    enabled: ${APP_BRANCH_SEGREGATION_ENABLED:true}
  resume:
    storage:
      path: uploads/resumes
  recording:
    upload-dir: ${APP_RECORDING_DIR:uploads/recordings}
  matching:
    weights:
      skill: 0.40
      experience: 0.20
      feedback: 0.20
      question-relevance: 0.20
  document-service:
    url: http://103.182.211.219:6565

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never


