server:
  port: 6006

spring:
  application:
    name: interview-service
  cloud:
    compatibility-verifier:
      enabled: false
  datasource:
    url: jdbc:postgresql://103.182.211.219:5434/aibot
    username: aibot
    password: aibot!@#$%
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 15
      minimum-idle: 3
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 30000
      validation-timeout: 5000
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: interview_svc
    open-in-view: false
  flyway:
    schemas: interview_svc
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: false
    ignore-migration-patterns: "*:missing,*:ignored"
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
      enabled: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:6009/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    hostname: localhost
    prefer-ip-address: false
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

app:
  jwt:
    secret: dev-jwt-secret-change-in-production-min-32-chars
  resume:
    storage:
      path: uploads/resumes
  matching:
    # Scoring weights for candidate matching
    weights:
      skill: 0.40
      experience: 0.20
      feedback: 0.20
      question-relevance: 0.20


