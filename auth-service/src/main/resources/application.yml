server:
  port: 6004

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://localhost:3308/bench_readiness
    username: postgres
    password: root
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: auth_svc
  flyway:
    schemas: auth_svc
    locations: classpath:db/migration

eureka:
  client:
    service-url:
      defaultZone: http://localhost:6009/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    hostname: localhost
    prefer-ip-address: false
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

app:
  jwt:
    secret: dev-jwt-secret-change-in-production-min-32-chars
    expiry-ms: 86400000
  demo:
    username: Demo
    password: Demo123
