server:
  port: 6004

spring:
  application:
    name: auth-service
  datasource:
    # socketTimeout/connectTimeout in seconds — required for remote PostgreSQL over slow networks
    url: jdbc:postgresql://103.182.211.219:5434/aibot?tcpKeepAlive=true&connectTimeout=60&socketTimeout=300&loginTimeout=60
    username: aibot
    password: aibot!@#$%
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 120000
      validation-timeout: 15000
      idle-timeout: 120000
      max-lifetime: 300000
      keepalive-time: 30000
      initialization-fail-timeout: 120000
      # Flyway migrations on remote DB can hold a connection >60s — avoid false leak warnings
      leak-detection-threshold: 180000
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: auth_svc
    open-in-view: false
  flyway:
    schemas: auth_svc
    locations: classpath:db/migration
    connect-retries: 5
    connect-retries-interval: 10s
  mail:
    host: smtp.gmail.com
    port: 587
    username: learningdevelopment.tyss@gmail.com
    password: xcbc bgrj lbql tgkd
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:6009/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    hostname: localhost
    prefer-ip-address: false
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

app:
  jwt:
    secret: dev-jwt-secret-change-in-production-min-32-chars
    expiry-ms: 86400000
  demo:
    username: Demo
    password: Demo123
  third-party:
    excel-api:
      base-url: http://localhost:8000
      timeout-seconds: 30

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env,loggers
  endpoint:
    health:
      show-details: always
