server:
  port: 6004

spring:
  # Optional .env at repo root (see .env.example). Override with ENV_FILE=/path/to/.env
  config:
    import:
      - optional:file:${ENV_FILE:${user.dir}/../.env}[.properties]
      - optional:file:${user.dir}/.env[.properties]
  application:
    name: auth-service
  datasource:
    # socketTimeout/connectTimeout in seconds — required for remote PostgreSQL over slow networks
    url: ${DB_URL:${DATABASE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:aibot}?tcpKeepAlive=true&connectTimeout=60&socketTimeout=300&loginTimeout=60}}
    username: ${DB_USERNAME:${DB_USER:}}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 120000
      validation-timeout: 15000
      idle-timeout: 120000
      max-lifetime: 300000
      keepalive-time: 30000
      initialization-fail-timeout: 120000
      # Flyway migrations on remote DB can hold a connection >60s — avoid false leak warnings
      leak-detection-threshold: 180000
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: auth_svc
    open-in-view: false
  flyway:
    schemas: auth_svc,master_data_svc
    locations: classpath:db/migration
    connect-retries: 5
    connect-retries-interval: 10s
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:learningdevelopment.tyss@gmail.com}
    password: ${MAIL_PASSWORD:"xcbc bgrj lbql tgkd"}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:6009/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    hostname: localhost
    prefer-ip-address: false
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

app:
  login-url: ${APP_LOGIN_URL:https://prod.voiceaibot.in/login}
  jwt:
    secret: ${JWT_SECRET:}
    issuer: ${JWT_ISSUER:benchreadiness-auth}
    audience: ${JWT_AUDIENCE:benchreadiness-api}
    access-expiry-ms: ${JWT_ACCESS_EXPIRY_MS:1800000}
    refresh-expiry-ms: ${JWT_REFRESH_EXPIRY_MS:604800000}
  auth:
    max-login-attempts: ${AUTH_MAX_LOGIN_ATTEMPTS:10}
    lockout-seconds: ${AUTH_LOCKOUT_SECONDS:900}
  gateway:
    shared-key: ${GATEWAY_SHARED_KEY:}
  branch-segregation:
    enabled: ${APP_BRANCH_SEGREGATION_ENABLED:true}
  third-party:
    excel-api:
      base-url: http://localhost:8000
      timeout-seconds: 30

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
