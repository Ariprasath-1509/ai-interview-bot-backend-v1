server:
  port: 6008

spring:
  application:
    name: review-service
  datasource:
    url: jdbc:postgresql://103.182.211.219:5434/aibot
    username: aibot
    password: aibot!@#$%
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: review_svc
  flyway:
    schemas: review_svc
    locations: classpath:db/migration

eureka:
  client:
    service-url:
      defaultZone: http://localhost:6009/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    hostname: localhost
    prefer-ip-address: false
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

feign:
  httpclient:
    hc5:
      enabled: true

app:
  jwt:
    secret: dev-jwt-secret-change-in-production-min-32-chars

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env,loggers
  endpoint:
    health:
      show-details: always
