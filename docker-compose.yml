services:

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - bench-network
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      retries: 5
      start_period: 30s

  logstash:
    image: docker.elastic.co/logstash/logstash:8.11.0
    container_name: logstash
    volumes:
      - ./elk/logstash/pipeline:/usr/share/logstash/pipeline
    ports:
      - "6010:6010"
      - "9600:9600"
    environment:
      - "LS_JAVA_OPTS=-Xmx256m -Xms256m"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - bench-network
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9600 || exit 1"]
      interval: 10s
      retries: 10
      start_period: 30s

  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: kibana
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - bench-network
    restart: always

  eureka-server:
    image: registry.gitlab.com/ty_optimize/optimize/ai_eurekha:latest
    container_name: eureka-server
    ports:
      - "6009:6009"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    networks:
      - bench-network
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6009/actuator/health"]
      interval: 10s
      retries: 5
      start_period: 20s

  compliance-service:
    image: registry.gitlab.com/ty_optimize/optimize/compliance_service:latest
    container_name: compliance-service
    ports:
      - "6005:6005"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      eureka-server:
        condition: service_healthy
      logstash:
        condition: service_healthy
    networks:
      - bench-network
    restart: always

  auth-service:
    image: registry.gitlab.com/ty_optimize/optimize/ai_auth:latest
    container_name: auth-service
    ports:
      - "6004:6004"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      eureka-server:
        condition: service_healthy
      logstash:
        condition: service_healthy
    networks:
      - bench-network
    restart: always

  interview-service:
    image: registry.gitlab.com/ty_optimize/optimize/interview_service:latest
    container_name: interview-service
    ports:
      - "6006:6006"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      eureka-server:
        condition: service_healthy
      compliance-service:
        condition: service_started
      auth-service:
        condition: service_started
      logstash:
        condition: service_healthy
    networks:
      - bench-network
    restart: always

  ai-service:
    image: registry.gitlab.com/ty_optimize/optimize/ai_service:latest
    container_name: ai-service
    ports:
      - "6003:6003"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      eureka-server:
        condition: service_healthy
      compliance-service:
        condition: service_started
      logstash:
        condition: service_healthy
    networks:
      - bench-network
    restart: always

  observer-service:
    image: registry.gitlab.com/ty_optimize/optimize/observer_service:latest
    container_name: observer-service
    ports:
      - "6007:6007"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      eureka-server:
        condition: service_healthy
      auth-service:
        condition: service_started
      interview-service:
        condition: service_started
      logstash:
        condition: service_healthy
    networks:
      - bench-network
    restart: always

  review-service:
    image: registry.gitlab.com/ty_optimize/optimize/review_service:latest
    container_name: review-service
    ports:
      - "6008:6008"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      eureka-server:
        condition: service_healthy
      interview-service:
        condition: service_started
      logstash:
        condition: service_healthy
    networks:
      - bench-network
    restart: always

  api-gateway:
    image: registry.gitlab.com/ty_optimize/optimize/api_gateway:latest
    container_name: api-gateway
    ports:
      - "6002:6002"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      eureka-server:
        condition: service_healthy
      logstash:
        condition: service_healthy
    networks:
      - bench-network
    restart: always

  questionbank-service:
    image: registry.gitlab.com/ty_optimize/optimize/questionbank_service:latest
    container_name: questionbank-service
    ports:
      - "6010:6010"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://103.182.211.219:5434/aibot
      SPRING_DATASOURCE_USERNAME: aibot
      SPRING_DATASOURCE_PASSWORD: aibot!@#$%
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    depends_on:
      eureka-server:
        condition: service_healthy
    networks:
      - bench-network
    restart: always

volumes:
  elasticsearch-data:
    driver: local

networks:
  bench-network:
    driver: bridge
