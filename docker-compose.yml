version: "3.8"

networks:
  bench-net:
    driver: bridge

services:

  eureka-server:
    image: registry.gitlab.com/ty_optimize/optimize/ai_eurekha:latest
    container_name: eureka-server
    ports:
      - "6009:6009"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    restart: always
    networks:
      - bench-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6009/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  compliance-service:
    image: registry.gitlab.com/ty_optimize/optimize/compliance_service:latest
    container_name: compliance-service
    ports:
      - "6005:6005"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      eureka-server:
        condition: service_healthy
    restart: always
    networks:
      - bench-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6005/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  auth-service:
    image: registry.gitlab.com/ty_optimize/optimize/ai_auth:latest
    container_name: auth-service
    ports:
      - "6004:6004"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      eureka-server:
        condition: service_healthy
    restart: always
    networks:
      - bench-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6004/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  interview-service:
    image: registry.gitlab.com/ty_optimize/optimize/interview_service:latest
    container_name: interview-service
    ports:
      - "6006:6006"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      eureka-server:
        condition: service_healthy
      compliance-service:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    restart: always
    networks:
      - bench-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6006/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  ai-service:
    image: registry.gitlab.com/ty_optimize/optimize/ai_service:latest
    container_name: ai-service
    ports:
      - "6003:6003"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      eureka-server:
        condition: service_healthy
      compliance-service:
        condition: service_healthy
    restart: always
    networks:
      - bench-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6003/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  observer-service:
    image: registry.gitlab.com/ty_optimize/optimize/observer_service:latest
    container_name: observer-service
    ports:
      - "6007:6007"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      eureka-server:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      interview-service:
        condition: service_healthy
    restart: always
    networks:
      - bench-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6007/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  review-service:
    image: registry.gitlab.com/ty_optimize/optimize/review_service:latest
    container_name: review-service
    ports:
      - "6008:6008"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      eureka-server:
        condition: service_healthy
      interview-service:
        condition: service_healthy
    restart: always
    networks:
      - bench-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6008/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  api-gateway:
    image: registry.gitlab.com/ty_optimize/optimize/api_gateway:latest
    container_name: api-gateway
    ports:
      - "6002:6002"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      eureka-server:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      interview-service:
        condition: service_healthy
      compliance-service:
        condition: service_healthy
    restart: always
    networks:
      - bench-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6002/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  frontend:
    image: registry.gitlab.com/ty_optimize/optimize/frontend:latest
    container_name: frontend
    ports:
      - "6001:6001"
    environment:
      API_URL: http://api-gateway:6002
      AUTH_SECRET: "dev-secret-change-me"
      NODE_ENV: production
    depends_on:
      api-gateway:
        condition: service_healthy
    restart: always
    networks:
      - bench-net
