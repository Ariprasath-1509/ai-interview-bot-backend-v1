# Bench Readiness production stack
# Configuration: copy .env.example to .env in this directory (same name Docker Compose loads).
# Run: docker compose --env-file .env up -d

x-default-env-file: &default-env-file
  env_file:
    - .env

services:

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: elasticsearch
    mem_limit: 6g
    memswap_limit: 6g
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms3g -Xmx3g"
    ports:
      - "6015:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - bench-network
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '3'
          memory: 6G
        reservations:
          cpus: '1.5'
          memory: 3G

  logstash:
    image: docker.elastic.co/logstash/logstash:8.11.0
    container_name: logstash
    mem_limit: 1536m
    memswap_limit: 1536m
    volumes:
      - ./elk/logstash/pipeline:/usr/share/logstash/pipeline
    ports:
      - "6010:5000"
    environment:
      - "LS_JAVA_OPTS=-Xmx768m -Xms768m"
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - bench-network
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9600 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1536M
        reservations:
          cpus: '0.75'
          memory: 1G

  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: kibana
    mem_limit: 1g
    memswap_limit: 1g
    ports:
      - "6012:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - bench-network
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  eureka-server:
    image: registry.gitlab.com/ty_optimize/optimize/ai_eurekha:latest
    container_name: eureka-server
    mem_limit: 512m
    memswap_limit: 512m
    ports:
      - "6009:6009"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JAVA_OPTS: "-Xms256m -Xmx512m"
    networks:
      - bench-network
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c '</dev/tcp/localhost/6009' || exit 1"]
      interval: 20s
      timeout: 15s
      retries: 15
      start_period: 90s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  ops-service:
    <<: *default-env-file
    image: registry.gitlab.com/ty_optimize/optimize/ops_service:latest
    container_name: ops-service
    mem_limit: 1536m
    memswap_limit: 1536m
    ports:
      - "6005:6005"
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: ${DB_URL:-}
      DB_USERNAME: ${DB_USERNAME:-}
      DATABASE_URL: ${DATABASE_URL:-}
      DB_USER: ${DB_USER:-}
      DB_PASSWORD: ${DB_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-benchreadiness-auth}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-benchreadiness-api}
      GATEWAY_SHARED_KEY: ${GATEWAY_SHARED_KEY:-}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      APP_INTERVIEW_BASE_URL: ${APP_INTERVIEW_BASE_URL:-https://prod.voiceaibot.in/interview}
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:-https://prod.voiceaibot.in}
      JAVA_OPTS: "-Xms512m -Xmx1280m -XX:+UseG1GC"
    depends_on:
      eureka-server:
        condition: service_healthy
    networks:
      - bench-network
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c '</dev/tcp/localhost/6005' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1536M
        reservations:
          cpus: '0.75'
          memory: 1G

  auth-service:
    <<: *default-env-file
    image: registry.gitlab.com/ty_optimize/optimize/ai_auth:latest
    container_name: auth-service
    mem_limit: 1536m
    memswap_limit: 1536m
    ports:
      - "6004:6004"
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: ${DB_URL:-}
      DB_USERNAME: ${DB_USERNAME:-}
      DATABASE_URL: ${DATABASE_URL:-}
      DB_USER: ${DB_USER:-}
      DB_PASSWORD: ${DB_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-benchreadiness-auth}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-benchreadiness-api}
      JWT_ACCESS_EXPIRY_MS: ${JWT_ACCESS_EXPIRY_MS:-1800000}
      JWT_REFRESH_EXPIRY_MS: ${JWT_REFRESH_EXPIRY_MS:-604800000}
      GATEWAY_SHARED_KEY: ${GATEWAY_SHARED_KEY:-}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      APP_LOGIN_URL: ${APP_LOGIN_URL:-https://prod.voiceaibot.in/login}
      AUTH_MAX_LOGIN_ATTEMPTS: ${AUTH_MAX_LOGIN_ATTEMPTS:-10}
      AUTH_LOCKOUT_SECONDS: ${AUTH_LOCKOUT_SECONDS:-900}
      JAVA_OPTS: "-Xms1g -Xmx1536m -XX:+UseG1GC -XX:MaxGCPauseMillis=200"
    depends_on:
      eureka-server:
        condition: service_healthy
    networks:
      - bench-network
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c '</dev/tcp/localhost/6004' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1536M
        reservations:
          cpus: '1'
          memory: 1G

  interview-service:
    <<: *default-env-file
    image: registry.gitlab.com/ty_optimize/optimize/interview_service:latest
    container_name: interview-service
    mem_limit: 4g
    memswap_limit: 4g
    ports:
      - "6006:6006"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: ${DB_URL:-}
      DB_USERNAME: ${DB_USERNAME:-}
      DATABASE_URL: ${DATABASE_URL:-}
      DB_USER: ${DB_USER:-}
      DB_PASSWORD: ${DB_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-benchreadiness-auth}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-benchreadiness-api}
      GATEWAY_SHARED_KEY: ${GATEWAY_SHARED_KEY:-}
      APP_RECORDING_DIR: /app/uploads/recordings
      JAVA_OPTS: "-Xms2g -Xmx3g -XX:+UseG1GC -XX:MaxGCPauseMillis=200"
    volumes:
      - interview-recordings:/app/uploads/recordings
    depends_on:
      eureka-server:
        condition: service_healthy
      ops-service:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    networks:
      - bench-network
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c '</dev/tcp/localhost/6006' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4G
        reservations:
          cpus: '2'
          memory: 2G

  ai-service:
    <<: *default-env-file
    image: registry.gitlab.com/ty_optimize/optimize/ai_service:latest
    container_name: ai-service
    mem_limit: 4g
    memswap_limit: 4g
    ports:
      - "6003:6003"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-benchreadiness-auth}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-benchreadiness-api}
      APP_LLM_PROVIDER: ${APP_LLM_PROVIDER:-claude}
      APP_CLAUDE_API_KEY: ${APP_CLAUDE_API_KEY}
      APP_CLAUDE_MODEL: ${APP_CLAUDE_MODEL:-claude-haiku-4-5}
      APP_CLAUDE_ASSESSMENT_MODEL: ${APP_CLAUDE_ASSESSMENT_MODEL:-claude-sonnet-4-5}
      APP_CLAUDE_QUESTION_TEMPERATURE: ${APP_CLAUDE_QUESTION_TEMPERATURE:-0.55}
      APP_CLAUDE_ASSESSMENT_TEMPERATURE: ${APP_CLAUDE_ASSESSMENT_TEMPERATURE:-0.25}
      # Ollama Configuration
      APP_OLLAMA_BASE_URL: ${APP_OLLAMA_BASE_URL:-http://103.182.211.219:11434}
      APP_OLLAMA_QUESTION_MODEL: ${APP_OLLAMA_QUESTION_MODEL:-qwen2.5:7b}
      APP_OLLAMA_ASSESSMENT_MODEL: ${APP_OLLAMA_ASSESSMENT_MODEL:-qwen2.5:32b}
      APP_OLLAMA_RUBRIC_MODEL: ${APP_OLLAMA_RUBRIC_MODEL:-qwen2.5:14b}
      APP_OLLAMA_MATCHING_MODEL: ${APP_OLLAMA_MATCHING_MODEL:-qwen2.5:32b}
      APP_OLLAMA_QUESTION_TEMPERATURE: ${APP_OLLAMA_QUESTION_TEMPERATURE:-0.55}
      APP_OLLAMA_ASSESSMENT_TEMPERATURE: ${APP_OLLAMA_ASSESSMENT_TEMPERATURE:-0.3}
      APP_OLLAMA_TIMEOUT_SECONDS: ${APP_OLLAMA_TIMEOUT_SECONDS:-600}
      APP_MEDIA_STT_PROVIDER: ${APP_MEDIA_STT_PROVIDER:-faster-whisper}
      APP_MEDIA_WHISPER_URL: ${APP_MEDIA_WHISPER_URL:-http://whisper-stt:8000}
      APP_MEDIA_WHISPER_MODEL: ${APP_MEDIA_WHISPER_MODEL:-medium}
      APP_MEDIA_KOKORO_URL: ${APP_MEDIA_KOKORO_URL:-http://kokoro-tts:8880}
      APP_MEDIA_KOKORO_VOICE: ${APP_MEDIA_KOKORO_VOICE:-af_heart}
      JAVA_OPTS: "-Xms2g -Xmx3g -XX:+UseG1GC -XX:MaxGCPauseMillis=200"
    depends_on:
      eureka-server:
        condition: service_healthy
      ops-service:
        condition: service_healthy
      whisper-stt:
        condition: service_started
      kokoro-tts:
        condition: service_healthy
    networks:
      - bench-network
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c '</dev/tcp/localhost/6003' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4G
        reservations:
          cpus: '2'
          memory: 2G

  review-service:
    <<: *default-env-file
    image: registry.gitlab.com/ty_optimize/optimize/review_service:latest
    container_name: review-service
    mem_limit: 1g
    memswap_limit: 1g
    ports:
      - "6008:6008"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: ${DB_URL:-}
      DB_USERNAME: ${DB_USERNAME:-}
      DATABASE_URL: ${DATABASE_URL:-}
      DB_USER: ${DB_USER:-}
      DB_PASSWORD: ${DB_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-benchreadiness-auth}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-benchreadiness-api}
      GATEWAY_SHARED_KEY: ${GATEWAY_SHARED_KEY:-}
      JAVA_OPTS: "-Xms512m -Xmx1024m -XX:+UseG1GC"
    depends_on:
      eureka-server:
        condition: service_healthy
      interview-service:
        condition: service_healthy
    networks:
      - bench-network
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c '</dev/tcp/localhost/6008' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  api-gateway:
    <<: *default-env-file
    image: registry.gitlab.com/ty_optimize/optimize/api_gateway:latest
    container_name: api-gateway
    mem_limit: 2g
    memswap_limit: 2g
    ports:
      - "6002:6002"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-benchreadiness-auth}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-benchreadiness-api}
      GATEWAY_SHARED_KEY: ${GATEWAY_SHARED_KEY:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:6001,http://localhost:6101}
      AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX:-20}
      AUTH_RATE_LIMIT_WINDOW_SECONDS: ${AUTH_RATE_LIMIT_WINDOW_SECONDS:-60}
      JAVA_OPTS: "-Xms1g -Xmx2g -XX:+UseG1GC -XX:MaxGCPauseMillis=100"
    depends_on:
      eureka-server:
        condition: service_healthy
    networks:
      - bench-network
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c '</dev/tcp/localhost/6002' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

  whisper-stt:
    image: fedirz/faster-whisper-server:latest-cpu
    container_name: whisper-stt
    mem_limit: 6g
    memswap_limit: 6g
    ports:
      - "6013:8000"
    environment:
      - WHISPER_MODEL=medium
      - WHISPER_LANGUAGE=en
      - VAD_FILTER=true
      - VAD_THRESHOLD=0.5
      - VAD_MIN_SPEECH_DURATION_MS=250
      - VAD_MAX_SPEECH_DURATION_S=120
      - VAD_MIN_SILENCE_DURATION_MS=2000
      - VAD_SPEECH_PAD_MS=400
    volumes:
      - whisper-models:/root/.cache/whisper
    networks:
      - bench-network
    restart: unless-stopped
    healthcheck:
      # Use uv run python (same runtime as uvicorn). Avoid CMD-SHELL: python may not be on PATH as `python`.
      test: ["CMD", "uv", "run", "python", "-c", "import socket; socket.create_connection(('127.0.0.1',8000),5).close()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s
    deploy:
      resources:
        limits:
          cpus: '8'
          memory: 6G
        reservations:
          cpus: '2'
          memory: 4G

  kokoro-tts:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:latest
    container_name: kokoro-tts
    mem_limit: 2g
    memswap_limit: 2g
    ports:
      - "6014:8880"
    # Models are downloaded on first start (~500 MB) and cached in the volume.
    volumes:
      - kokoro-models:/app/models
    networks:
      - bench-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8880/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 180s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G

  questionbank-service:
    <<: *default-env-file
    image: registry.gitlab.com/ty_optimize/optimize/questionbank_service:latest
    container_name: questionbank-service
    mem_limit: 1g
    memswap_limit: 1g
    ports:
      - "6016:6016"
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: ${DB_URL:-}
      DB_USERNAME: ${DB_USERNAME:-}
      DB_QB_URL: ${DB_QB_URL:-}
      DATABASE_URL: ${DATABASE_URL:-}
      DB_USER: ${DB_USER:-}
      DB_PASSWORD: ${DB_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-benchreadiness-auth}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-benchreadiness-api}
      GATEWAY_SHARED_KEY: ${GATEWAY_SHARED_KEY:-}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      APP_CLAUDE_API_KEY: ${APP_CLAUDE_API_KEY:-}
      APP_CLAUDE_MODEL: ${APP_CLAUDE_MODEL:-claude-haiku-4-5}
      JAVA_OPTS: "-Xms512m -Xmx1024m -XX:+UseG1GC"
    depends_on:
      eureka-server:
        condition: service_healthy
    networks:
      - bench-network
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c '</dev/tcp/localhost/6016' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

volumes:
  elasticsearch-data:
    driver: local
  whisper-models:
    driver: local
  kokoro-models:
    driver: local
  interview-recordings:
    driver: local

networks:
  bench-network:
    driver: bridge
