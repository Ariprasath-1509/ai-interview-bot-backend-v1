server:
  port: 6002

spring:
  application:
    name: api-gateway
  cloud:
    compatibility-verifier:
      enabled: false
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: ["http://localhost:6001","http://localhost:6101","http://103.182.211.219:6001","http://103.182.211.219:6101"]
            allowedMethods: ["GET","POST","PUT","PATCH","DELETE","OPTIONS"]
            allowedHeaders: ["*"]
            allowCredentials: true
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**
          filters:
            - RewritePath=/api/(?<segment>.*), /$\{segment}
        - id: auth-service-direct
          uri: lb://auth-service
          predicates:
            - Path=/auth/**
        - id: interview-service
          uri: lb://interview-service
          predicates:
            - Path=/api/interviews/**,/api/engineers/**,/api/jd/**,/api/analytics/**,/api/recruiter/**,/api/matching/**,/api/resumes/**,/api/clients/**
          filters:
            - RewritePath=/api/(?<segment>.*), /$\{segment}
        - id: interview-service-direct
          uri: lb://interview-service
          predicates:
            - Path=/interviews/**,/engineers/**,/jd/**,/analytics/**,/recruiter/**,/matching/**,/resumes/**,/clients/**
        - id: ai-service
          uri: lb://ai-service
          predicates:
            - Path=/api/ai/**
          filters:
            - RewritePath=/api/(?<segment>.*), /$\{segment}
        - id: ai-service-direct
          uri: lb://ai-service
          predicates:
            - Path=/ai/**
        - id: observer-service
          uri: lb://observer-service
          predicates:
            - Path=/api/observer/**,/api/ws/**
          filters:
            - RewritePath=/api/(?<segment>.*), /$\{segment}
        - id: observer-service-direct
          uri: lb://observer-service
          predicates:
            - Path=/observer/**,/ws/**
        - id: review-service
          uri: lb://review-service
          predicates:
            - Path=/api/reviews/**,/api/scores/**
          filters:
            - RewritePath=/api/(?<segment>.*), /$\{segment}
        - id: review-service-direct
          uri: lb://review-service
          predicates:
            - Path=/reviews/**,/scores/**
        - id: compliance-service
          uri: lb://compliance-service
          predicates:
            - Path=/api/compliance/**,/api/tokens/**
          filters:
            - RewritePath=/api/(?<segment>.*), /$\{segment}
        - id: compliance-service-direct
          uri: lb://compliance-service
          predicates:
            - Path=/compliance/**,/tokens/**
        - id: questionbank-service
          uri: lb://questionbank-service
          predicates:
            - Path=/api/qb/**,/api/questionbank/**
          filters:
            - RewritePath=/api/(qb|questionbank)/(?<segment>.*), /api/$\{segment}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:6009/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    hostname: localhost
    prefer-ip-address: false

app:
  jwt:
    secret: dev-jwt-secret-change-in-production-min-32-chars

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env,loggers,gateway
  endpoint:
    health:
      show-details: always
    gateway:
      enabled: true
