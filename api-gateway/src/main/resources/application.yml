server:
  port: 6002

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "http://localhost:6001"
            allowedMethods: ["GET","POST","PUT","PATCH","DELETE","OPTIONS"]
            allowedHeaders: ["*"]
            allowCredentials: true
      routes:
        - id: auth-service
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/api/auth/**
          filters:
            - RewritePath=/api/(?<segment>.*), /$\{segment}
        - id: auth-service-direct
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/auth/**
        - id: interview-service
          uri: lb://INTERVIEW-SERVICE
          predicates:
            - Path=/api/interviews/**,/api/engineers/**,/api/jd/**,/api/analytics/**
          filters:
            - RewritePath=/api/(?<segment>.*), /$\{segment}
        - id: interview-service-direct
          uri: lb://INTERVIEW-SERVICE
          predicates:
            - Path=/interviews/**,/engineers/**,/jd/**,/analytics/**
        - id: ai-service
          uri: lb://AI-SERVICE
          predicates:
            - Path=/api/ai/**
          filters:
            - RewritePath=/api/(?<segment>.*), /$\{segment}
        - id: ai-service-direct
          uri: lb://AI-SERVICE
          predicates:
            - Path=/ai/**
        - id: observer-service
          uri: lb://OBSERVER-SERVICE
          predicates:
            - Path=/api/observer/**,/api/ws/**
          filters:
            - RewritePath=/api/(?<segment>.*), /$\{segment}
        - id: observer-service-direct
          uri: lb://OBSERVER-SERVICE
          predicates:
            - Path=/observer/**,/ws/**
        - id: review-service
          uri: lb://REVIEW-SERVICE
          predicates:
            - Path=/api/reviews/**,/api/scores/**
          filters:
            - RewritePath=/api/(?<segment>.*), /$\{segment}
        - id: review-service-direct
          uri: lb://REVIEW-SERVICE
          predicates:
            - Path=/reviews/**,/scores/**
        - id: compliance-service
          uri: lb://COMPLIANCE-SERVICE
          predicates:
            - Path=/api/compliance/**,/api/tokens/**
          filters:
            - RewritePath=/api/(?<segment>.*), /$\{segment}
        - id: compliance-service-direct
          uri: lb://COMPLIANCE-SERVICE
          predicates:
            - Path=/compliance/**,/tokens/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:6009/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    hostname: localhost
    prefer-ip-address: false

app:
  jwt:
    secret: dev-jwt-secret-change-in-production-min-32-chars
