server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "http://localhost:3000"
            allowedMethods: ["GET","POST","PUT","PATCH","DELETE","OPTIONS"]
            allowedHeaders: ["*"]
            allowCredentials: true
      routes:
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/auth/**
        - id: interview-service
          uri: http://localhost:8082
          predicates:
            - Path=/interviews/**,/engineers/**,/jd/**,/analytics/**
        - id: ai-service
          uri: http://localhost:8083
          predicates:
            - Path=/ai/**
        - id: observer-service
          uri: http://localhost:8084
          predicates:
            - Path=/observer/**,/ws/**
        - id: review-service
          uri: http://localhost:8085
          predicates:
            - Path=/reviews/**,/scores/**
        - id: compliance-service
          uri: http://localhost:8086
          predicates:
            - Path=/compliance/**,/tokens/**

app:
  jwt:
    secret: ${JWT_SECRET:dev-jwt-secret-change-in-production-min-32-chars}
