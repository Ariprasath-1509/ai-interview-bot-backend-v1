server:
  port: 6002

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "http://localhost:6001"
            allowedMethods: ["GET","POST","PUT","PATCH","DELETE","OPTIONS"]
            allowedHeaders: ["*"]
            allowCredentials: true
      routes:
        - id: auth-service
          uri: http://localhost:6004
          predicates:
            - Path=/auth/**
        - id: interview-service
          uri: http://localhost:6006
          predicates:
            - Path=/interviews/**,/engineers/**,/jd/**,/analytics/**
        - id: ai-service
          uri: http://localhost:6003
          predicates:
            - Path=/ai/**
        - id: observer-service
          uri: http://localhost:6007
          predicates:
            - Path=/observer/**,/ws/**
        - id: review-service
          uri: http://localhost:6008
          predicates:
            - Path=/reviews/**,/scores/**
        - id: compliance-service
          uri: http://localhost:6005
          predicates:
            - Path=/compliance/**,/tokens/**

app:
  jwt:
    secret: ${JWT_SECRET:dev-jwt-secret-change-in-production-min-32-chars}
