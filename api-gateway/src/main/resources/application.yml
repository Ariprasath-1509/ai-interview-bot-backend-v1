server:
  port: 6002

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "http://localhost:6001"
            allowedMethods: ["GET","POST","PUT","PATCH","DELETE","OPTIONS"]
            allowedHeaders: ["*"]
            allowCredentials: true
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/auth/**
        - id: interview-service
          uri: lb://interview-service
          predicates:
            - Path=/interviews/**,/engineers/**,/jd/**,/analytics/**
        - id: ai-service
          uri: lb://ai-service
          predicates:
            - Path=/ai/**
        - id: observer-service
          uri: lb://observer-service
          predicates:
            - Path=/observer/**,/ws/**
        - id: review-service
          uri: lb://review-service
          predicates:
            - Path=/reviews/**,/scores/**
        - id: compliance-service
          uri: lb://compliance-service
          predicates:
            - Path=/compliance/**,/tokens/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:6009/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

app:
  jwt:
    secret: dev-jwt-secret-change-in-production-min-32-chars
