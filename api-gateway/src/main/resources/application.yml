server:
  port: 6002

spring:
  # Optional .env at repo root (see .env.example). Override with ENV_FILE=/path/to/.env
  config:
    import:
      - optional:file:${ENV_FILE:${user.dir}/../.env}[.properties]
      - optional:file:${user.dir}/.env[.properties]
  application:
    name: api-gateway
  codec:
    max-in-memory-size: 100MB
  cloud:
    compatibility-verifier:
      enabled: false
    gateway:
      httpclient:
        response-timeout: 600s
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: ["http://localhost:6001","http://localhost:6101","http://103.182.211.219:6001","http://103.182.211.219:6101"]
            allowedMethods: ["GET","POST","PUT","PATCH","DELETE","OPTIONS"]
            allowedHeaders: ["*"]
            allowCredentials: true
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**
          filters:
            - RewritePath=/api/(?<segment>.*), /$\{segment}
        - id: auth-service-direct
          uri: lb://auth-service
          predicates:
            - Path=/auth/**
        - id: interview-service
          uri: lb://interview-service
          predicates:
            - Path=/api/interviews/**,/api/engineers/**,/api/jd/**,/api/analytics/**,/api/recruiter/**,/api/matching/**,/api/resumes/**,/api/clients/**
          filters:
            - RewritePath=/api/(?<segment>.*), /$\{segment}
        - id: interview-service-direct
          uri: lb://interview-service
          predicates:
            - Path=/interviews/**,/engineers/**,/jd/**,/analytics/**,/recruiter/**,/matching/**,/resumes/**,/clients/**
        - id: ai-service
          uri: lb://ai-service
          predicates:
            - Path=/api/ai/**
          filters:
            - RewritePath=/api/(?<segment>.*), /$\{segment}
        - id: ai-service-direct
          uri: lb://ai-service
          predicates:
            - Path=/ai/**
        - id: ops-service-observer
          uri: lb://ops-service
          predicates:
            - Path=/api/observer/**,/api/ws/**
          filters:
            - RewritePath=/api/(?<segment>.*), /$\{segment}
        - id: ops-service-observer-direct
          uri: lb://ops-service
          predicates:
            - Path=/observer/**,/ws/**
        - id: review-service
          uri: lb://review-service
          predicates:
            - Path=/api/reviews/**,/api/scores/**
          filters:
            - RewritePath=/api/(?<segment>.*), /$\{segment}
        - id: review-service-direct
          uri: lb://review-service
          predicates:
            - Path=/reviews/**,/scores/**
        - id: ops-service-compliance
          uri: lb://ops-service
          predicates:
            - Path=/api/compliance/**,/api/tokens/**
          filters:
            - RewritePath=/api/(?<segment>.*), /$\{segment}
        - id: ops-service-compliance-direct
          uri: lb://ops-service
          predicates:
            - Path=/compliance/**,/tokens/**
        - id: questionbank-service
          uri: lb://questionbank-service
          predicates:
            - Path=/api/qb/**,/api/questionbank/**,/api/admin/**
          filters:
            - RewritePath=/api/(qb|questionbank)/(?<segment>.*), /api/${segment}
        - id: questionbank-service-direct
          uri: lb://questionbank-service
          predicates:
            - Path=/questionbank/**
          filters:
            - RewritePath=/questionbank/(?<segment>.*), /${segment}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:6009/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    hostname: localhost
    prefer-ip-address: false

app:
  jwt:
    secret: ${JWT_SECRET:}
    issuer: ${JWT_ISSUER:benchreadiness-auth}
    audience: ${JWT_AUDIENCE:benchreadiness-api}
  auth-rate-limit:
    max-requests: ${AUTH_RATE_LIMIT_MAX:20}
    window-seconds: ${AUTH_RATE_LIMIT_WINDOW_SECONDS:60}
  gateway:
    shared-key: ${GATEWAY_SHARED_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
    gateway:
      enabled: false
